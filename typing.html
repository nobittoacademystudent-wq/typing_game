<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タイピング宇宙船 - 教室共有版</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap">
  <style>
    body { margin: 0; background: #0d1b2a; color: #e8f4f8; font-family: 'M PLUS Rounded 1c', sans-serif; }
    @keyframes twinkle { from { opacity: 0.15; } to { opacity: 0.75; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ★ ここにデプロイしたウェブアプリのURLを貼り付けてください ★
    const API_URL = "https://script.google.com/macros/s/AKfycbz8U5ICHG_zlgyYSeLV2iNShEBzMHJadWxy_6OJ7rIXPIQqY_zr-tPEikQUxPyC6yL0/exec";

    const t = { bg: "#0d1b2a", panel: "#1a2d45", accent: "#00e5ff", gold: "#ffd166", green: "#06d6a0", red: "#ef476f", text: "#e8f4f8", muted: "#7fa8c0" };

    function App() {
      const [screen, setScreen] = useState("home");
      const [playerName, setName] = useState("");
      const [sharedText, setText] = useState("The quick brown fox jumps over the lazy dog.");
      const [input, setInput] = useState("");
      const [startTime, setStart] = useState(null);
      const [mistakes, setMistakes] = useState(0);
      const [rankings, setRankings] = useState([]);
      const [loading, setLoading] = useState(false);

      // ランキング読み込み
      const fetchRankings = () => {
        fetch(API_URL)
          .then(res => res.json())
          .then(data => setRankings(data))
          .catch(err => console.error("Fetch Error:", err));
      };

      useEffect(() => { fetchRankings(); }, []);

      const handleType = (e) => {
        const val = e.target.value;
        if (!startTime) setStart(Date.now());
        
        let errs = 0;
        for (let i = 0; i < val.length; i++) {
          if (val[i] !== sharedText[i]) errs++;
        }
        setMistakes(errs);
        setInput(val);

        if (val === sharedText) {
          const time = (Date.now() - startTime) / 1000;
          const result = { name: playerName, chars: val.length, mistakes: errs, time: time };
          setLoading(true);
          
          // スプレッドシートに送信
          fetch(API_URL, {
            method: "POST",
            body: JSON.stringify(result)
          })
          .then(() => {
            alert(`ミッション完了！ タイム: ${time}秒`);
            fetchRankings();
            setScreen("ranking");
            setInput("");
            setStart(null);
            setLoading(false);
          });
        }
      };

      const cardStyle = { background: t.panel, borderRadius: "20px", padding: "2rem", boxShadow: `0 0 30px ${t.accent}22`, maxWidth: "600px", margin: "0 auto", textAlign: "center", position: "relative" };
      const btnStyle = (color = t.accent) => ({ background: "transparent", border: `2px solid ${color}`, color, borderRadius: "12px", padding: "0.8rem 1.5rem", fontSize: "1rem", cursor: "pointer", fontWeight: "bold", margin: "5px" });
      const inputStyle = { width: "80%", background: "#0a1828", border: `2px solid ${t.accent}44`, borderRadius: "10px", padding: "12px", color: "white", fontSize: "1.2rem", outline: "none" };

      return (
        <div style={{ padding: "2rem" }}>
          <div style={{ textAlign: "center", marginBottom: "2rem" }}>
            <div style={{ fontSize: "4rem", animation: "float 3s infinite" }}>🚀</div>
            <h1 style={{ color: t.accent, fontWeight: 900 }}>宇宙タイピング共有版</h1>
            {loading && <div style={{ color: t.gold }}>🛰️ 通信中...</div>}
          </div>

          {screen === "home" && (
            <div style={cardStyle}>
              <p>パイロット名を入力</p>
              <input style={inputStyle} value={playerName} onChange={e => setName(e.target.value)} placeholder="なまえ" />
              <div style={{ marginTop: "20px" }}>
                <button style={btnStyle(t.green)} onClick={() => setScreen("typing")} disabled={!playerName}>開始！</button>
                <button style={btnStyle(t.gold)} onClick={() => setScreen("ranking")}>ランキング</button>
              </div>
            </div>
          )}

          {screen === "typing" && (
            <div style={cardStyle}>
              <div style={{ fontSize: "1.5rem", marginBottom: "20px", textAlign: "left", lineHeight: "1.8" }}>
                {sharedText.split("").map((ch, i) => (
                  <span key={i} style={{
                    color: i < input.length ? (input[i] === ch ? t.green : t.red) : t.muted,
                    background: i === input.length ? `${t.accent}33` : "none"
                  }}>{ch}</span>
                ))}
              </div>
              <input autoFocus style={inputStyle} value={input} onChange={handleType} />
              <div style={{ marginTop: "15px", color: t.red }}>ミス: {mistakes}</div>
            </div>
          )}

          {screen === "ranking" && (
            <div style={cardStyle}>
              <h2>🏆 教室ランキング</h2>
              <div style={{ maxHeight: "300px", overflowY: "auto", textAlign: "left" }}>
                {rankings.map((r, i) => (
                  <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "8px", borderBottom: "1px solid #333" }}>
                    <span>{i + 1}. {r.name}</span>
                    <span style={{ color: t.accent }}>{r.time}秒</span>
                  </div>
                ))}
              </div>
              <button style={btnStyle()} onClick={() => setScreen("home")} style={{ marginTop: "20px" }}>戻る</button>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
